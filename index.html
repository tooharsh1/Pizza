<script type="text/plain" id="src-exp2">
import numpy as np
import matplotlib.pyplot as plt
from scipy.signal import hilbert
from scipy.special import erfc

rng = np.random.default_rng(42)

fs = 1000
t = np.linspace(0, 1, fs)
fc = 50
fm = 5
message = np.sin(2 * np.pi * fm * t)


def am_transmit(msg):
    carrier = np.sin(2 * np.pi * fc * t)
    return (1 + msg) * carrier


def am_receive(rx):
    envelope = np.abs(hilbert(rx))
    return envelope - np.mean(envelope)


# ================= EXPERIMENT 1: Noise sweep on the analog AM chain =================
print("=" * 60)
print("EXPERIMENT 1: Noise sweep on the analog AM chain")
print("=" * 60)

tx_signal = am_transmit(message)
signal_power = np.mean(tx_signal ** 2)

noise_levels_demo = [0.05, 0.3, 1.0]
fig, axes = plt.subplots(len(noise_levels_demo), 2, figsize=(12, 8), sharex=True)

for row, sigma in enumerate(noise_levels_demo):
    noise = rng.normal(0, sigma, len(t))
    rx_signal = tx_signal + noise
    recovered = am_receive(rx_signal)
    snr_db = 10 * np.log10(signal_power / sigma**2)
    print(f"  noise std = {sigma:>5.2f} -> SNR = {snr_db:6.2f} dB")

    axes[row, 0].plot(t, rx_signal, lw=0.6, color="tab:gray")
    axes[row, 0].set_title(f"Received signal, noise std = {sigma} (SNR = {snr_db:.1f} dB)")
    axes[row, 1].plot(t, message, "k--", lw=1, label="original")
    axes[row, 1].plot(t, recovered, color="tab:blue", lw=1, label="recovered")
    axes[row, 1].set_title(f"Recovered message, noise std = {sigma}")
    axes[row, 1].legend(loc="upper right", fontsize=8)

axes[-1, 0].set_xlabel("Time (s)")
axes[-1, 1].set_xlabel("Time (s)")
fig.suptitle("Experiment 1a: Recovered-signal degradation as noise increases")
fig.tight_layout()
fig.savefig("exp1_noise_sweep_waveforms.png", dpi=150)

# ---- Experiment 1b: SNR vs noise level, and recovery quality ----
noise_sweep = np.linspace(0.02, 1.2, 30)
snr_sweep_db = 10 * np.log10(signal_power / noise_sweep**2)
quality = []
for sigma in noise_sweep:
    rx = tx_signal + rng.normal(0, sigma, len(t))
    rec = am_receive(rx)
    quality.append(np.corrcoef(message, rec)[0, 1])

fig, ax1 = plt.subplots(figsize=(8, 5))
ax1.plot(noise_sweep, snr_sweep_db, "o-", color="tab:blue", label="SNR (dB)")
ax1.set_xlabel("Noise standard deviation")
ax1.set_ylabel("SNR (dB)", color="tab:blue")
ax1.tick_params(axis="y", labelcolor="tab:blue")
ax2 = ax1.twinx()
ax2.plot(noise_sweep, quality, "s--", color="tab:red",
         label="Correlation (recovered vs original)")
ax2.set_ylabel("Recovery quality (correlation)", color="tab:red")
ax2.tick_params(axis="y", labelcolor="tab:red")
plt.title("Experiment 1b: SNR vs noise level, and recovery quality")
fig.tight_layout()
fig.savefig("exp1_snr_vs_noise.png", dpi=150)

# ================= EXPERIMENT 2: Modulation-scheme comparison =================
print("\n" + "=" * 60)
print("EXPERIMENT 2: Modulation-scheme comparison")
print("=" * 60)

sigma_analog = 0.5
kf = 30.0
phase = 2 * np.pi * fc * t + 2 * np.pi * kf * np.cumsum(message) / fs
fm_tx = np.cos(phase)

noise = rng.normal(0, sigma_analog, len(t))
am_rx = am_transmit(message) + noise
fm_rx = fm_tx + noise

am_rec = am_receive(am_rx)

analytic = hilbert(fm_rx)
inst_phase = np.unwrap(np.angle(analytic))
inst_freq = np.diff(inst_phase) * fs / (2 * np.pi)
fm_rec = (inst_freq - fc) / kf
fm_rec = fm_rec - np.mean(fm_rec)
win = 25
fm_rec_smooth = np.convolve(fm_rec, np.ones(win) / win, mode="same")

am_corr = np.corrcoef(message, am_rec)[0, 1]
fm_corr = np.corrcoef(message[:-1], fm_rec_smooth)[0, 1]
print(f"  AM recovery correlation at noise std {sigma_analog}: {am_corr:.3f}")
print(f"  FM recovery correlation at noise std {sigma_analog}: {fm_corr:.3f}")

fig, axes = plt.subplots(3, 1, figsize=(10, 8), sharex=True)
axes[0].plot(t, message, "k")
axes[0].set_title("Original message (5 Hz tone)")
axes[1].plot(t, am_rec, color="tab:blue")
axes[1].set_title(f"AM + envelope detection (corr = {am_corr:.3f})")
axes[2].plot(t[:-1], fm_rec_smooth, color="tab:green")
axes[2].set_title(f"FM + phase-derivative detection (corr = {fm_corr:.3f})")
axes[2].set_xlabel("Time (s)")
fig.suptitle(f"Experiment 2a: AM vs FM at the same noise level (std = {sigma_analog})")
fig.tight_layout()
fig.savefig("exp2_am_vs_fm.png", dpi=150)


def digital_ber(num_bits, snr_db, scheme):
    bits = rng.integers(0, 2, num_bits)
    if scheme == "PSK":
        symbols = 2 * bits - 1.0
        avg_energy = 1.0
        threshold = 0.0
    elif scheme == "ASK":
        amp = np.sqrt(2.0)
        symbols = bits * amp
        avg_energy = 1.0
        threshold = amp / 2
    else:
        raise ValueError(scheme)
    snr_linear = 10 ** (snr_db / 10)
    noise_std = np.sqrt(avg_energy / (2 * snr_linear))
    received = symbols + rng.normal(0, noise_std, num_bits)
    detected = (received > threshold).astype(int)
    return np.mean(detected != bits)


num_bits_cmp = 200_000
snr_range_db = np.arange(0, 13, 1)
ber_ask = [digital_ber(num_bits_cmp, s, "ASK") for s in snr_range_db]
ber_psk = [digital_ber(num_bits_cmp, s, "PSK") for s in snr_range_db]

plt.figure(figsize=(7, 5))
plt.semilogy(snr_range_db, ber_ask, "s-", label="ASK (on-off keying)")
plt.semilogy(snr_range_db, ber_psk, "o-", label="PSK (BPSK)")
plt.xlabel("Average SNR (dB)")
plt.ylabel("Bit Error Rate")
plt.title("Experiment 2b: ASK vs PSK noise resistance")
plt.grid(True, which="both", alpha=0.4)
plt.legend()
plt.tight_layout()
plt.savefig("exp2_ask_vs_psk.png", dpi=150)

print(f"  At 8 dB: ASK BER = {ber_ask[8]:.2e}, PSK BER = {ber_psk[8]:.2e}")
print("  -> PSK is more robust: its two states are +1/-1 (maximum separation),")
print("     while ASK 'wastes' half the decision distance by turning one state off.")

# ================= EXPERIMENT 3: BER vs SNR with QPSK extension =================
print("\n" + "=" * 60)
print("EXPERIMENT 3: BER vs SNR (1,000,000 bits) with QPSK extension")
print("=" * 60)


def bpsk_ber(num_bits, snr_db):
    bits = rng.integers(0, 2, num_bits)
    symbols = 2 * bits - 1.0
    snr_linear = 10 ** (snr_db / 10)
    noise = rng.normal(0, np.sqrt(1 / (2 * snr_linear)), num_bits)
    detected = (symbols + noise > 0).astype(int)
    return np.mean(detected != bits)


def qpsk_ber(num_bits, snr_db):
    num_bits -= num_bits % 2
    bits = rng.integers(0, 2, num_bits)
    i_bits, q_bits = bits[0::2], bits[1::2]
    i_sym = (2 * i_bits - 1) / np.sqrt(2)
    q_sym = (2 * q_bits - 1) / np.sqrt(2)
    snr_linear = 10 ** (snr_db / 10)
    noise_std = np.sqrt(1 / (2 * snr_linear))
    i_rx = i_sym + rng.normal(0, noise_std, len(i_sym))
    q_rx = q_sym + rng.normal(0, noise_std, len(q_sym))
    det = np.empty(num_bits, dtype=int)
    det[0::2] = (i_rx > 0).astype(int)
    det[1::2] = (q_rx > 0).astype(int)
    return np.mean(det != bits)


num_bits_big = 1_000_000
snr_range_db = np.arange(0, 13, 1)
snr_linear = 10 ** (snr_range_db / 10)
ber_bpsk = [bpsk_ber(num_bits_big, s) for s in snr_range_db]
ber_qpsk = [qpsk_ber(num_bits_big, s) for s in snr_range_db]
theory_bpsk = 0.5 * erfc(np.sqrt(snr_linear))
theory_qpsk = 0.5 * erfc(np.sqrt(snr_linear / 2))

plt.figure(figsize=(8, 5.5))
plt.semilogy(snr_range_db, ber_bpsk, "o", color="tab:blue", label="BPSK (simulated, 1e6 bits)")
plt.semilogy(snr_range_db, theory_bpsk, "-", color="tab:blue", alpha=0.6, label="BPSK (theory)")
plt.semilogy(snr_range_db, ber_qpsk, "s", color="tab:orange", label="QPSK (simulated, 1e6 bits)")
plt.semilogy(snr_range_db, theory_qpsk, "-", color="tab:orange", alpha=0.6, label="QPSK (theory)")
plt.xlabel("SNR per symbol, Es/N0 (dB)")
plt.ylabel("Bit Error Rate")
plt.title("Experiment 3: BER vs SNR – BPSK vs QPSK (2x data rate)")
plt.grid(True, which="both", alpha=0.4)
plt.ylim(1e-6, 1)
plt.legend()
plt.tight_layout()
plt.savefig("exp3_ber_bpsk_qpsk.png", dpi=150)

for s in (4, 8, 12):
    idx = int(np.where(snr_range_db == s)[0][0])
    print(f"  SNR {s:2d} dB: BPSK BER = {ber_bpsk[idx]:.2e}   QPSK BER = {ber_qpsk[idx]:.2e}")
print("QPSK carries 2 bits/symbol (double the data rate) but needs ~3 dB")
print("more symbol SNR for the same BER: the classic rate-vs-reliability tradeoff.")

plt.show()
</script>

<script type="text/plain" id="src-exp8">
import hmac
import hashlib
import secrets

# 128-bit secret key stored in SIM
KI = bytes.fromhex("00112233445566778899AABBCCDDEEFF")


# A3 generates 32-bit SRES for authentication
def A3_authentication(ki, rand):
    return hmac.new(ki, b"A3" + rand, hashlib.sha256).digest()[:4]


# A8 generates 64-bit session key Kc
def A8_key_generation(ki, rand):
    return hmac.new(ki, b"A8" + rand, hashlib.sha256).digest()[:8]


# A5 performs encryption and decryption using XOR
def A5_encrypt(data, kc):
    keystream = bytearray()
    counter = 0

    # Generate required keystream
    while len(keystream) < len(data):
        block = hashlib.sha256(
            kc + counter.to_bytes(4, "big")
        ).digest()
        keystream.extend(block)
        counter += 1

    # XOR data with keystream
    return bytes(a ^ b for a, b in zip(data, keystream))


print("=" * 60)
print("              GSM SECURITY SIMULATION")
print("=" * 60)
print("Ki (SIM Secret Key):", KI.hex().upper())

session = 1

while True:
    print("\n" + "-" * 60)
    print(f"                    SESSION {session}")
    print("-" * 60)

    # Random challenge
    print("\n[1] RANDOM CHALLENGE (RAND)")
    RAND = secrets.token_bytes(8)
    print("RAND          :", RAND.hex().upper())

    # A3 authentication
    print("\n[2] A3 AUTHENTICATION")
    generated_sres = A3_authentication(KI, RAND)

    # Simulate received SRES
    received_sres = generated_sres

    print("Generated SRES:", generated_sres.hex().upper())
    print("Received SRES :", received_sres.hex().upper())

    if hmac.compare_digest(generated_sres, received_sres):
        print("Authentication: SUCCESS")
    else:
        print("Authentication: FAILURE")
        continue

    # A8 key generation
    print("\n[3] A8 KEY GENERATION")
    kc = A8_key_generation(KI, RAND)
    print("Generated Kc  :", kc.hex().upper())

    # Get message from user
    print("\n[4] MESSAGE INPUT")
    message = input("Enter message to encrypt (or 'exit' to stop): ")

    if message.lower() == "exit":
        print("\nGSM SIMULATION STOPPED.")
        break

    plaintext = message.encode("utf-8")
    plaintext_hex = plaintext.hex().upper()
    print("Plaintext     :", message)
    print("Plaintext HEX :", plaintext_hex)

    # A5 encryption
    print("\n[5] A5 ENCRYPTION")
    ciphertext = A5_encrypt(plaintext, kc)
    print("Plaintext     :", message)
    print("Plaintext HEX :", plaintext_hex)
    print("Ciphertext HEX:", ciphertext.hex().upper())

    # A5 decryption
    print("\n[6] A5 DECRYPTION")
    decrypted = A5_encrypt(ciphertext, kc)
    decrypted_message = decrypted.decode("utf-8")
    print("Ciphertext HEX:", ciphertext.hex().upper())
    print("Decrypted     :", decrypted_message)
    print("Decrypted HEX :", decrypted.hex().upper())

    # Verify decrypted message
    print("\n[7] DECRYPTION VERIFICATION")
    if decrypted == plaintext:
        print("Decryption    : SUCCESS")
        print("Messages MATCH.")
    else:
        print("Decryption    : FAILURE")
        print("Messages DO NOT MATCH.")

    # End current session
    print("\n" + "=" * 60)
    print(f"                 SESSION {session} COMPLETED")
    print("=" * 60)
    print("Authentication : SUCCESS")
    print("Encryption     : COMPLETED")
    print("Decryption     : COMPLETED")
    print("Verification   : SUCCESS")
    print("\nNext session will generate a NEW RAND and NEW Kc.")

    session += 1
</script>
<script type="text/plain" id="src-exp3">
import numpy as np
import matplotlib.pyplot as plt
import matplotlib.image as mpimg
from matplotlib.patches import RegularPolygon

LETTERS = "ABCDEFG"


def axial_to_pixel(q, r, R):
    """Flat-top hexagon axial coordinates -> Cartesian pixel coordinates."""
    x = 1.5 * R * q
    y = np.sqrt(3) * R * (r + q / 2.0)
    return x, y


def build_cluster(i, j):
    """Cluster size N and the two lattice vectors that generate it."""
    N = i**2 + i * j + j**2
    A = (i, j)
    B = (-j, i + j)
    return N, A, B


def make_labeller(i, j, N):
    """
    Return a function label(q, r) -> integer 0..N-1 that is identical on
    two cells if and only if they are co-channel. Works for ALL valid
    (i, j), including non-coprime pairs like (2, 2) for N = 12.
    """
    pair_to_id = {}

    def label(q, r):
        u = ((i + j) * q + j * r) % N
        v = (-j * q + i * r) % N
        key = (u, v)
        if key not in pair_to_id:
            pair_to_id[key] = len(pair_to_id)
        return pair_to_id[key]

    return label


def generate_reuse_pattern(i, j, R=1.0, grid_span=7, save=True):
    """Build one complete reuse pattern and return (figure, results dict)."""
    N, A, B = build_cluster(i, j)
    label = make_labeller(i, j, N)

    centers = []
    window = grid_span * 1.55 * R
    for q in range(-grid_span - 2, grid_span + 3):
        for r in range(-grid_span - 2, grid_span + 3):
            x, y = axial_to_pixel(q, r, R)
            if abs(x) > window or abs(y) > window:
                continue
            centers.append((x, y, label(q, r)))

    n_labels = len({lab for _, _, lab in centers})
    assert n_labels == N, f"labelling produced {n_labels} labels, expected {N}"

    fig, ax = plt.subplots(figsize=(7.2, 7.2))
    for x, y, lab in centers:
        color = "#e74c3c" if lab == 0 else "#dfe6e9"
        ax.add_patch(RegularPolygon(
            (x, y), numVertices=6, radius=R * 0.985, orientation=np.pi / 6,
            edgecolor="black", facecolor=color, linewidth=0.8))
        letter = LETTERS[lab] if lab < 26 else str(lab)
        ax.text(x, y, letter, ha="center", va="center", fontsize=9,
                fontweight="bold" if lab == 0 else "normal",
                color="white" if lab == 0 else "black")

    co = np.array([(x, y) for x, y, lab in centers if lab == 0])
    nearest = []
    for x0, y0 in co:
        d = np.hypot(co[:, 0] - x0, co[:, 1] - y0)
        d = d[d > 1e-9]
        if len(d):
            nearest.append(d.min())
    D_measured = float(np.median(nearest))
    D_theory = R * np.sqrt(3 * N)
    assert abs(D_measured - D_theory) < 1e-6 * R, "geometry check failed!"

    p0 = co[np.argmin(np.hypot(co[:, 0], co[:, 1]))]
    d0 = np.hypot(co[:, 0] - p0[0], co[:, 1] - p0[1])
    d0[d0 < 1e-9] = np.inf
    p1 = co[np.argmin(d0)]
    ax.plot([p0[0], p1[0]], [p0[1], p1[1]], "b--", lw=2)
    ax.annotate(f"D = {D_measured:.3f}",
                ((p0[0] + p1[0]) / 2, (p0[1] + p1[1]) / 2),
                textcoords="offset points", xytext=(0, 10),
                color="blue", fontsize=11, fontweight="bold", ha="center")

    ax.set_xlim(-window - R, window + R)
    ax.set_ylim(-window - R, window + R)
    ax.set_aspect("equal")
    ax.axis("off")
    ax.set_title(f"Frequency Reuse Pattern, N = {N} (i = {i}, j = {j})   "
                 f"D/R = {D_measured/R:.3f}", fontsize=12)

    fname = f"reuse_N{N}.png"
    if save:
        fig.savefig(fname, dpi=200, bbox_inches="tight")

    n_path = 4.0
    Q = D_theory / R
    sir_db = 10 * np.log10((Q ** n_path) / 6.0)
    total_channels = 420
    per_cell = total_channels // N

    return fig, dict(N=N, i=i, j=j, ratio_theory=D_theory / R,
                     ratio_measured=D_measured / R, sir_db=sir_db,
                     channels_per_cell=per_cell, file=fname)


def generate_patterns_overview(results, fname="reuse_patterns_overview.png"):
    """Assemble the saved individual patterns into one 2 x 3 overview figure."""
    fig, axes = plt.subplots(2, 3, figsize=(15, 10.5))
    for ax, res in zip(axes.flat, results):
        ax.imshow(mpimg.imread(res["file"]))
        ax.axis("off")
        ax.set_title(f"N = {res['N']}   D/R = {res['ratio_measured']:.3f}   "
                     f"SIR = {res['sir_db']:.1f} dB", fontsize=11)
    for ax in list(axes.flat)[len(results):]:
        ax.axis("off")
    fig.suptitle("Frequency reuse patterns for all valid cluster sizes "
                 "N = 1, 3, 4, 7", fontsize=14)
    fig.tight_layout()
    fig.savefig(fname, dpi=150, bbox_inches="tight")
    return fig


def generate_tradeoff_curve(results, fname="tradeoff_curve.png"):
    Ns = np.array([r["N"] for r in results])
    sir = np.array([r["sir_db"] for r in results])
    ch = np.array([r["channels_per_cell"] for r in results])

    fig, ax1 = plt.subplots(figsize=(8, 5))
    ax1.plot(Ns, sir, "o-", color="tab:green", lw=2)
    ax1.set_xlabel("Cluster size N")
    ax1.set_ylabel("First-tier SIR (dB)", color="tab:green")
    ax1.tick_params(axis="y", labelcolor="tab:green")
    ax1.axhline(18, color="gray", ls=":", lw=1)
    ax1.text(Ns[0] + 0.1, 18.3, "typical 18 dB requirement",
             fontsize=9, color="gray")
    ax2 = ax1.twinx()
    ax2.plot(Ns, ch, "s--", color="tab:purple", lw=2)
    ax2.set_ylabel("Channels per cell (420 total)", color="tab:purple")
    ax2.tick_params(axis="y", labelcolor="tab:purple")
    plt.title("Capacity vs Interference tradeoff across cluster sizes")
    fig.tight_layout()
    fig.savefig(fname, dpi=150)
    return fig


if __name__ == "__main__":
    configs = [(1, 0), (1, 1), (2, 0), (2, 1)]   # N = 1, 3, 4, 7
    hdr = (f"{'N':>3} {'(i,j)':>7} {'D/R theory':>11} {'D/R measured':>13} "
           f"{'SIR (dB)':>9} {'ch/cell':>8}")
    print(hdr)
    print("-" * len(hdr))

    results = []
    for i, j in configs:
        fig, res = generate_reuse_pattern(i, j)
        results.append(res)
        print(f"{res['N']:>3} ({res['i']},{res['j']})"
              f"{res['ratio_theory']:>12.3f}{res['ratio_measured']:>14.3f}"
              f"{res['sir_db']:>10.2f}{res['channels_per_cell']:>9}")

    generate_patterns_overview(results)
    generate_tradeoff_curve(results)

    print("\nAll geometry checks passed: measured D/R = sqrt(3N) exactly.")
    print("Saved: " + ", ".join(r["file"] for r in results)
          + ", reuse_patterns_overview.png, tradeoff_curve.png")
    plt.show()   # display every reuse pattern + overview + tradeoff curve

import csv
import os

import numpy as np
import matplotlib.pyplot as plt

F_MHZ = 2400.0      # 2.4 GHz Wi-Fi
D0 = 1.0            # reference distance (metres)

# ----------------------------------------------------------------------
# STEP 1 - Data input: your field readings from the phone app
# ----------------------------------------------------------------------
SAMPLE_CSV = """Distance_m,RSSI1_dBm,RSSI2_dBm
1,-35,-37
2,-42,-40
5,-55,-53
10,-65,-67
15,-72,-70
20,-78,-76
"""


def load_readings(fname="rssi_distance.csv"):
    """Read (distance, [readings...]) rows; create a sample on first run."""
    if not os.path.exists(fname):
        with open(fname, "w") as f:
            f.write(SAMPLE_CSV)
        print(f"[i] No {fname} found - a SAMPLE file was created with the")
        print("    handout's illustrative values. Replace them with your own")
        print("    field readings, then rerun.")
    dists, all_readings = [], []
    with open(fname) as f:
        for row in csv.reader(f):
            if not row or row[0].startswith("Distance"):
                continue                  # skip header / blank lines
            dists.append(float(row[0]))
            all_readings.append([float(v) for v in row[1:] if v.strip()])
    return np.array(dists), all_readings


# ----------------------------------------------------------------------
# STEP 2 - Average the repeat readings (and keep their spread)
# ----------------------------------------------------------------------
def average_readings(all_readings):
    """Mean and spread (std dev) of the repeat readings at each distance."""
    means = np.array([np.mean(r) for r in all_readings])
    spreads = np.array([np.std(r) for r in all_readings])
    return means, spreads


# ----------------------------------------------------------------------
# STEP 3 - Theory: FSPL and the free-space prediction
# ----------------------------------------------------------------------
def fspl_db(d, f_mhz=F_MHZ):
    """Free Space Path Loss in dB (d in metres, f in MHz)."""
    return 20 * np.log10(d) + 20 * np.log10(f_mhz) - 27.55


def free_space_prediction(d, rssi_at_d0):
    """
    Free-space RSSI curve ANCHORED at your own d0 = 1 m measurement:
        RSSI(d) = RSSI(d0) - [FSPL(d) - FSPL(d0)]
                = RSSI(d0) - 20*log10(d/D0)
    Anchoring removes the unknown router transmit power and antenna gains
    from the comparison - only the SHAPE of the decay is being tested.
    """
    return rssi_at_d0 - 20 * np.log10(d / D0)


# ----------------------------------------------------------------------
# STEP 4 - Fit the Log-Distance Path Loss Model: find YOUR n
# ----------------------------------------------------------------------
def fit_path_loss_exponent(dists, rssi_means):
    """
    Log-distance model: RSSI(d) = RSSI(d0) - 10*n*log10(d/d0).
    Rearranged, RSSI is LINEAR in x = 10*log10(d/d0) with slope -n,
    so a least-squares straight-line fit gives n directly.
    Returns (n, rssi_d0_fit, sigma) where sigma is the shadowing spread
    X_sigma - the std dev of the residuals around the fitted line.
    """
    x = 10 * np.log10(dists / D0)
    slope, intercept = np.polyfit(x, rssi_means, 1)
    n = -slope
    residuals = rssi_means - (slope * x + intercept)
    sigma = float(np.std(residuals))
    return n, intercept, sigma


def classify_environment(n):
    if n < 2.2:
        return "free-space-like (open, unobstructed)"
    if n < 3.0:
        return "lightly obstructed indoor / open corridor"
    if n < 4.0:
        return "typical indoor with walls and furniture"
    return "heavily obstructed indoor (many walls / floors)"


# ----------------------------------------------------------------------
# STEP 5 - Report table and figures
# ----------------------------------------------------------------------
def print_table(dists, all_readings, means, theory, fitted):
    n_rd = max(len(r) for r in all_readings)
    hdr = ("Dist (m) " + "".join(f"R{k+1} (dBm) " for k in range(n_rd))
           + "Avg (dBm)  Free-space  Fitted model  Extra loss")
    print("\n" + hdr)
    print("-" * len(hdr))
    for i, d in enumerate(dists):
        rd = "".join(f"{v:>8.0f} " for v in all_readings[i]).ljust(n_rd * 10)
        extra = theory[i] - means[i]      # how far BELOW free space we are
        print(f"{d:>7.0f} {rd}{means[i]:>8.1f} {theory[i]:>10.1f} "
              f"{fitted[i]:>12.1f} {extra:>9.1f}")


def plot_rssi_vs_distance(dists, means, spreads, n, rssi_d0,
                          fname="rssi_vs_distance.png"):
    d_smooth = np.linspace(dists.min(), dists.max(), 300)
    theory = free_space_prediction(d_smooth, means[0])
    fitted = rssi_d0 - 10 * n * np.log10(d_smooth / D0)

    fig, ax = plt.subplots(figsize=(8.5, 5.5))
    ax.errorbar(dists, means, yerr=spreads, fmt="o", color="tab:blue",
                capsize=4, markersize=7, label="Measured (avg ± spread)")
    ax.plot(d_smooth, theory, "--", color="tab:green", lw=2,
            label="Free space, n = 2 (anchored at 1 m)")
    ax.plot(d_smooth, fitted, "-", color="tab:red", lw=2,
            label=f"Fitted log-distance model, n = {n:.2f}")
    ax.set_xlabel("Distance from router (m)")
    ax.set_ylabel("RSSI (dBm)")
    ax.set_title("Signal strength vs distance: measurement, free-space "
                 "theory, fitted model")
    ax.grid(alpha=0.3)
    ax.legend()
    fig.tight_layout()
    fig.savefig(fname, dpi=150)
    return fig


def plot_semilog(dists, means, spreads, n, rssi_d0,
                 fname="rssi_vs_log_distance.png"):
    d_smooth = np.linspace(dists.min(), dists.max(), 300)
    fitted = rssi_d0 - 10 * n * np.log10(d_smooth / D0)

    fig, ax = plt.subplots(figsize=(8.5, 5.5))
    ax.errorbar(dists, means, yerr=spreads, fmt="o", color="tab:blue",
                capsize=4, markersize=7, label="Measured (avg ± spread)")
    ax.plot(d_smooth, fitted, "-", color="tab:red", lw=2,
            label=f"Fitted line, slope = -10n = {-10*n:.1f} dB/decade")
    ax.set_xscale("log")
    ax.set_xticks(dists)
    ax.set_xticklabels([f"{d:g}" for d in dists])
    ax.set_xlabel("Distance from router (m) - log scale")
    ax.set_ylabel("RSSI (dBm)")
    ax.set_title("The same data on a log-distance axis: the decay "
                 "becomes a straight line")
    ax.grid(alpha=0.3, which="both")
    ax.legend()
    fig.tight_layout()
    fig.savefig(fname, dpi=150)
    return fig


# ----------------------------------------------------------------------
# MAIN - run the whole analysis
# ----------------------------------------------------------------------
if __name__ == "__main__":
    dists, all_readings = load_readings()
    means, spreads = average_readings(all_readings)

    # theory curve at the measurement distances (anchored at d0 = 1 m)
    theory = free_space_prediction(dists, means[0])

    # fit the log-distance model
    n, rssi_d0_fit, sigma = fit_path_loss_exponent(dists, means)
    fitted = rssi_d0_fit - 10 * n * np.log10(dists / D0)

    print("\n=== RSSI vs distance survey (f = %.0f MHz) ===" % F_MHZ)
    print_table(dists, all_readings, means, theory, fitted)

    print(f"\nAbsolute FSPL at 1 m and {F_MHZ:.0f} MHz: {fspl_db(1.0):.1f} dB")
    print(f"Implied router EIRP (RSSI at 1 m + FSPL at 1 m): "
          f"{means[0] + fspl_db(1.0):.1f} dBm")
    print(f"\nFitted path loss exponent n = {n:.2f}")
    print(f"Shadowing spread sigma = {sigma:.2f} dB")
    print(f"Environment classification : {classify_environment(n)}")
    print("Rule-of-thumb check: doubling distance costs "
          f"{10 * n * np.log10(2):.1f} dB here (free space: 6.0 dB)")

    plot_rssi_vs_distance(dists, means, spreads, n, rssi_d0_fit)
    plot_semilog(dists, means, spreads, n, rssi_d0_fit)
    print("\nSaved: rssi_vs_distance.png, rssi_vs_log_distance.png")
    plt.show()

import csv
import os
import re
import subprocess
import sys

import numpy as np
import matplotlib.pyplot as plt


def freq_to_channel(mhz):
    """Convert a centre frequency in MHz to a Wi-Fi channel number."""
    if 2412 <= mhz <= 2472:
        return (mhz - 2407) // 5          # 2.4 GHz: ch 1..13
    if mhz == 2484:
        return 14                         # Japan-only channel 14
    if 5000 <= mhz <= 5900:
        return (mhz - 5000) // 5          # 5 GHz: ch 36, 40, ...
    return None


def scan_windows():
    """Parse 'netsh wlan show networks mode=bssid' (Windows)."""
    out = subprocess.run(
        ["netsh", "wlan", "show", "networks", "mode=bssid"],
        capture_output=True, text=True).stdout
    nets, ssid = [], None
    for line in out.splitlines():
        line = line.strip()
        m = re.match(r"SSID \d+ : (.*)", line)
        if m:
            ssid = m.group(1).strip() or "<hidden>"
        m = re.match(r"Signal\s*:\s*(\d+)%", line)
        if m and ssid is not None:
            pct = int(m.group(1))
            rssi = pct / 2 - 100          # standard %-to-dBm approximation
            nets.append({"ssid": ssid, "rssi": rssi, "channel": None})
        m = re.match(r"Channel\s*:\s*(\d+)", line)
        if m and nets and nets[-1]["channel"] is None:
            nets[-1]["channel"] = int(m.group(1))
    return [n for n in nets if n["channel"] is not None]


def scan_linux():
    """Parse 'nmcli -t -f SSID,SIGNAL,CHAN dev wifi' (Linux)."""
    out = subprocess.run(
        ["nmcli", "-t", "-f", "SSID,SIGNAL,CHAN", "dev", "wifi"],
        capture_output=True, text=True).stdout
    nets = []
    for line in out.splitlines():
        parts = line.rsplit(":", 2)       # SSID may itself contain ':'
        if len(parts) != 3:
            continue
        ssid, signal, chan = parts
        try:
            pct, ch = int(signal), int(chan)
        except ValueError:
            continue
        nets.append({"ssid": ssid or "<hidden>",
                     "rssi": pct / 2 - 100, "channel": ch})
    return nets


def scan_macos():
    """Parse the macOS 'airport -s' scan output."""
    airport = ("/System/Library/PrivateFrameworks/Apple80211.framework/"
               "Versions/Current/Resources/airport")
    out = subprocess.run([airport, "-s"], capture_output=True,
                         text=True).stdout
    nets = []
    for line in out.splitlines()[1:]:
        m = re.match(r"\s*(.+?)\s+([0-9a-f:]{17})\s+(-\d+)\s+(\d+)", line)
        if m:
            nets.append({"ssid": m.group(1).strip(),
                         "rssi": float(m.group(3)),
                         "channel": int(m.group(4).split(",")[0])})
    return nets


SAMPLE_CSV = """SSID,RSSI_dBm,Channel
MyHomeWiFi,-42,6
Airtel_4G21,-58,1
JioFiber_2G,-61,6
TP-Link_A3F2,-66,6
Neighbour_2G,-70,1
Excitel_204,-72,11
D-Link_Home,-75,4
ACT_Fibernet,-77,9
CoffeeShop_Free,-81,11
MyHomeWiFi_5G,-48,36
JioFiber_5G,-63,44
OnePlus_Hotspot,-69,149
"""


def load_csv(fname="wifi_scan.csv"):
    """Read manually recorded readings (from the phone app) out of a CSV."""
    if not os.path.exists(fname):
        with open(fname, "w") as f:
            f.write(SAMPLE_CSV)
        print(f"[i] No {fname} found - a SAMPLE file was created. Replace its")
        print("    rows with your own readings from the phone app, then rerun.")
    nets = []
    with open(fname) as f:
        for row in csv.DictReader(f):
            nets.append({"ssid": row["SSID"],
                         "rssi": float(row["RSSI_dBm"]),
                         "channel": int(row["Channel"])})
    return nets


def get_networks():
    """Try a live OS scan first; fall back to the CSV if it fails."""
    try:
        if sys.platform.startswith("win"):
            nets = scan_windows()
        elif sys.platform == "darwin":
            nets = scan_macos()
        else:
            nets = scan_linux()
        if nets:
            print(f"[i] Live scan found {len(nets)} networks.")
            return nets, "live scan"
    except Exception as e:
        print(f"[!] Live scan failed ({e}).")
    return load_csv(), "CSV file"


def plot_channel_graph(nets, fname="channel_graph_24ghz.png"):
    """
    Draw each 2.4 GHz network as a curve centred on its channel.
    A 20 MHz-wide transmission on channel c occupies roughly channels
    c-2 .. c+2 (channels are only 5 MHz apart), which is why the curves
    overlap - exactly what the phone app shows.
    """
    nets24 = [n for n in nets if n["channel"] <= 14]
    fig, ax = plt.subplots(figsize=(10, 5.5))
    cmap = plt.cm.tab10
    floor = -95                            # graph floor (below = unusable)

    for k, n in enumerate(nets24):
        c, r = n["channel"], n["rssi"]
        x = np.linspace(c - 2, c + 2, 200)
        y = floor + (r - floor) * np.cos((x - c) / 2 * np.pi / 2) ** 2
        color = cmap(k % 10)
        ax.plot(x, y, color=color, lw=2)
        ax.fill_between(x, floor, y, color=color, alpha=0.15)
        ax.annotate(n["ssid"], (c, r), textcoords="offset points",
                    xytext=(0, 4), ha="center", fontsize=8, color=color)

    for c in (1, 6, 11):                   # the three non-overlapping channels
        ax.axvline(c, color="gray", ls=":", lw=1)

    ax.set_xticks(range(1, 14))
    ax.set_xlim(-1.5, 15.5)
    ax.set_ylim(floor, -25)
    ax.set_xlabel("2.4 GHz channel number")
    ax.set_ylabel("RSSI (dBm)")
    ax.set_title("Channel graph - each network drawn on its channel "
                 "(dotted lines: non-overlapping channels 1, 6, 11)")
    ax.grid(axis="y", alpha=0.3)
    fig.tight_layout()
    fig.savefig(fname, dpi=150)
    return fig


def quality(rssi):
    """Map an RSSI reading to the standard signal-quality wording."""
    if rssi >= -50:
        return "Excellent"
    if rssi >= -60:
        return "Good"
    if rssi >= -70:
        return "Fair"
    if rssi >= -80:
        return "Weak"
    return "Very poor"


def band_of(channel):
    return "2.4 GHz" if channel <= 14 else "5 GHz"


def print_table(nets):
    print(f"\n{'SSID':<20} {'RSSI (dBm)':>10} {'Channel':>8} "
          f"{'Band':>8} {'Quality':>10}")
    print("-" * 62)
    for n in sorted(nets, key=lambda n: n["rssi"], reverse=True):
        print(f"{n['ssid'][:20]:<20} {n['rssi']:>10.0f} {n['channel']:>8} "
              f"{band_of(n['channel']):>8} {quality(n['rssi']):>10}")


def congestion(nets):
    """
    Count how many networks OVERLAP each 2.4 GHz channel, not just how many
    are centred on it: a network on channel c interferes with channels
    c-2 .. c+2. This is the number that actually predicts contention.
    """
    counts = {c: 0 for c in range(1, 14)}
    for n in nets:
        if n["channel"] <= 14:
            for c in range(max(1, n["channel"] - 2),
                           min(13, n["channel"] + 2) + 1):
                counts[c] += 1
    return counts


def plot_congestion(nets, fname="channel_congestion.png"):
    counts = congestion(nets)
    fig, ax = plt.subplots(figsize=(9, 4.5))
    colors = ["#2ecc71" if c in (1, 6, 11) else "#95a5a6" for c in counts]
    ax.bar(list(counts.keys()), list(counts.values()), color=colors)
    ax.set_xticks(range(1, 14))
    ax.set_xlabel("2.4 GHz channel number")
    ax.set_ylabel("Networks overlapping this channel")
    ax.set_title("Channel congestion (green = the non-overlapping "
                 "channels 1, 6, 11)")
    ax.grid(axis="y", alpha=0.3)
    fig.tight_layout()
    fig.savefig(fname, dpi=150)
    return fig


def recommend_channel(nets):
    counts = congestion(nets)
    best = min((1, 6, 11), key=lambda c: counts[c])
    print("\nCongestion on the three non-overlapping channels:")
    for c in (1, 6, 11):
        print(f"  channel {c:>2}: {counts[c]} overlapping network(s)")
    print(f"[>] Recommended channel for a new 2.4 GHz router here: {best}")
    return best


if __name__ == "__main__":
    nets, source = get_networks()
    print(f"\n=== Wi-Fi survey ({source}) ===")
    print_table(nets)

    n24 = sum(1 for n in nets if n["channel"] <= 14)
    n5 = len(nets) - n24
    print(f"\nBand summary: {n24} networks on 2.4 GHz, {n5} on 5 GHz.")

    plot_channel_graph(nets)
    plot_congestion(nets)
    recommend_channel(nets)
    print("\nSaved: channel_graph_24ghz.png, channel_congestion.png")
    plt.show()

<script type="text/plain" id="src-exp9">
import os
import csv

import numpy as np
import matplotlib.pyplot as plt

WAVELENGTH_M = 0.125   # 12.5 cm at 2.4 GHz

SAMPLE_SCAN_CSV = """Position_cm,RSSI_Indoor_dBm,RSSI_Outdoor_dBm
0,-50,-57
10,-56,-58
20,-47,-58
30,-60,-59
40,-51,-59
50,-58,-60
"""

SAMPLE_STATIONARY_CSV = """Time_s,RSSI_dBm
0,-51
5,-52
10,-50
15,-54
20,-52
25,-53
30,-51
35,-55
40,-52
45,-54
50,-53
55,-52
"""


def load_scan(fname="scan.csv"):
    if not os.path.exists(fname):
        with open(fname, "w") as f:
            f.write(SAMPLE_SCAN_CSV)
    pos, indoor, outdoor = [], [], []
    with open(fname) as f:
        for r in csv.reader(f):
            if not r or r[0].startswith("Position"):
                continue
            pos.append(float(r[0]))
            indoor.append(float(r[1]))
            outdoor.append(float(r[2]) if len(r) > 2 and r[2].strip() else np.nan)
    return np.array(pos), np.array(indoor), np.array(outdoor)


def load_stationary(fname="stationary.csv"):
    if not os.path.exists(fname):
        with open(fname, "w") as f:
            f.write(SAMPLE_STATIONARY_CSV)
    time_s, rssi = [], []
    with open(fname) as f:
        for r in csv.reader(f):
            if not r or r[0].startswith("Time"):
                continue
            time_s.append(float(r[0]))
            rssi.append(float(r[1]))
    return np.array(time_s), np.array(rssi)


def roughness(r):
    # Mean absolute step-to-step change: smooth traces -> small, multipath traces -> large
    valid = r[~np.isnan(r)]
    return float(np.mean(np.abs(np.diff(valid))))


def fade_depth(r):
    # Peak-to-null swing, dB
    valid = r[~np.isnan(r)]
    return float(valid.max() - valid.min())


def reversals(r):
    # % of steps where RSSI got STRONGER while moving further away
    valid = r[~np.isnan(r)]
    d = np.diff(valid)
    return 100.0 * float(np.sum(d > 0)) / d.size


def print_report(pos, indoor, outdoor, time_s, stat_rssi):
    r_ind = roughness(indoor)
    r_out = roughness(outdoor)
    f_ind = fade_depth(indoor)
    f_out = fade_depth(outdoor)
    rev_ind = reversals(indoor)
    rev_out = reversals(outdoor)

    print("=== Multipath fading survey ===")
    print("Wavelength at 2.4 GHz = 12.5 cm -> peaks/nulls repeat about every 6.2 cm\n")
    print(
        f"{'Trace':<10} | {'Mean (dBm)':<11} | {'Spread (dB)':<11} | "
        f"{'Roughness (dB)':<15} | {'Fade Depth (dB)':<14} | {'Reversals'}")
    print("-" * 85)
    print(
        f"{'Indoor':<10} | {np.mean(indoor):<11.1f} | {np.std(indoor):<11.1f} | "
        f"{r_ind:<15.1f} | {f_ind:<14.1f} | {rev_ind:.0f}%")
    print(
        f"{'Outdoor':<10} | {np.nanmean(outdoor):<11.1f} | {np.nanstd(outdoor):<11.1f} | "
        f"{r_out:<15.1f} | {f_out:<14.1f} | {rev_out:.0f}%")

    stat_mean = np.mean(stat_rssi)
    stat_spread = stat_rssi.max() - stat_rssi.min()
    print(f"\nStanding still: mean {stat_mean:.1f} dBm, but the reading still varied by {stat_spread:.0f} dB")
    print("without moving at all (people/doors changing the reflections).\n")

    ratio = r_ind / r_out if r_out > 0 else 0
    print("HEADLINE: the indoor trace is {:.1f}x rougher than outdoors ({:.1f} vs {:.1f} dB per step),".format(
        ratio, r_ind, r_out))
    print("which is the signature of multipath fading.")


def plot_scan(pos, indoor, outdoor):
    plt.figure(figsize=(8, 4.5))
    plt.plot(pos, indoor, 'o-', color='#3b3b3b', label='Indoor (many reflectors)')
    plt.plot(pos, outdoor, 's--', color='#7a7a7a', label='Outdoor (few reflectors)')
    plt.title('Multipath fading: RSSI vs position, indoor vs outdoor')
    plt.xlabel('Position along the scan (cm)')
    plt.ylabel('RSSI (dBm)')
    plt.legend()
    plt.grid(True, linestyle=':', alpha=0.6)
    plt.tight_layout()


def plot_stationary(time_s, rssi):
    plt.figure(figsize=(8, 4.5))
    plt.plot(time_s, rssi, 'o-', color='#5c5c5c')
    mean_val = np.mean(rssi)
    plt.axhline(mean_val, color='gray', linestyle=':', alpha=0.7)
    spread = rssi.max() - rssi.min()
    plt.title(f'Standing perfectly still: RSSI still varies by {spread:.0f} dB')
    plt.text(time_s[-1], rssi.max(), f'mean: {mean_val:.1f} dBm', ha='right', va='top')
    plt.xlabel('Time (s)')
    plt.ylabel('RSSI (dBm)')
    plt.grid(True, linestyle=':', alpha=0.6)
    plt.tight_layout()


def plot_roughness(indoor, outdoor):
    labels = ['Indoor', 'Outdoor']
    rough = [roughness(indoor), roughness(outdoor)]
    fade = [fade_depth(indoor), fade_depth(outdoor)]
    x = np.arange(len(labels))
    width = 0.35

    plt.figure(figsize=(7, 4.5))
    plt.bar(x - width / 2, rough, width, label='Roughness (mean |step|, dB)', color='#5a5a5a')
    plt.bar(x + width / 2, fade, width, label='Fade depth (peak to null, dB)', color='#c7b299')
    for i in range(len(labels)):
        plt.text(x[i] - width / 2, rough[i] + 0.2, f'{rough[i]:.1f}', ha='center')
        plt.text(x[i] + width / 2, fade[i] + 0.2, f'{fade[i]:.1f}', ha='center')
    plt.title('Indoor vs outdoor: how jagged is the signal?')
    plt.ylabel('dB')
    plt.xticks(x, labels)
    plt.legend()
    plt.grid(axis='y', linestyle=':', alpha=0.6)
    plt.tight_layout()


def plot_two_ray(distance_cm=50, reflection=1.0):
    x = np.linspace(0, distance_cm, 2000) / 100.0            # metres
    phase = 2 * np.pi * (2 * x) / WAVELENGTH_M               # path difference ~ 2x
    combined = np.abs(1 + reflection * np.exp(1j * phase)) / (1 + reflection)
    db = 20 * np.log10(np.maximum(combined, 1e-4))

    plt.figure(figsize=(8, 4.5))
    plt.plot(x * 100, db, color='#555555')
    plt.ylim(-30, 2)
    plt.title('Two-ray theory: peaks and nulls repeat every ~6.2 cm (half a wavelength)')
    plt.xlabel('Receiver position (cm)')
    plt.ylabel('Combined signal (dB relative to peak)')
    plt.grid(True, linestyle=':', alpha=0.6)
    plt.tight_layout()


if __name__ == "__main__":
    pos, indoor, outdoor = load_scan()
    time_s, stat_rssi = load_stationary()

    print_report(pos, indoor, outdoor, time_s, stat_rssi)

    plot_scan(pos, indoor, outdoor)
    plot_stationary(time_s, stat_rssi)
    plot_roughness(indoor, outdoor)
    plot_two_ray()
    plt.show()

<script type="text/plain" id="src-exp10">
import csv
import os
from collections import OrderedDict

import numpy as np
import matplotlib.pyplot as plt

# ==============================================================
# SETTINGS
# ==============================================================
HYSTERESIS_DB = 3.0
PING_PONG_WINDOW_S = 20.0

# ==============================================================
# CSV DATA (changed according to the given handover values)
# ==============================================================
CSV_DATA = """Time_s,ServingCellID,ServingRSRP_dBm,NeighborCellID,NeighborRSRP_dBm
10,12345,-81,67890,-92
15,12345,-85,67890,-88
20,12345,-89,67890,-84
25,67890,-83,12345,-91
30,67890,-86,12345,-88
35,12345,-87,67890,-89
40,12345,-84,67890,-91
45,12345,-88,67890,-86
50,67890,-82,12345,-90
55,67890,-85,12345,-87
60,67890,-88,12345,-84
65,12345,-86,67890,-90
70,12345,-83,67890,-87
75,12345,-89,67890,-85
80,67890,-81,12345,-92
85,67890,-84,12345,-88
90,12345,-86,67890,-87
"""

csv_file = "handover_log.csv"
with open(csv_file, "w") as file:
    file.write(CSV_DATA)

print("CSV file created successfully:")
print(csv_file)


# ==============================================================
# LOAD CSV DATA
# ==============================================================
def load_log(filename):
    rows = []
    with open(filename, "r") as file:
        reader = csv.reader(file)
        for row in reader:
            if not row:
                continue
            if row[0].strip() == "Time_s":
                continue
            rows.append({
                "t": float(row[0]),
                "cell": row[1].strip(),
                "rsrp": float(row[2]),
                "ncell": row[3].strip(),
                "nrsrp": float(row[4])
            })
    return sorted(rows, key=lambda x: x["t"])


# ==============================================================
# DETECT HANDOVERS
# ==============================================================
def detect_handovers(rows):
    events = []
    for previous, current in zip(rows, rows[1:]):
        # Check whether serving cell changed
        if previous["cell"] == current["cell"]:
            continue

        margin = np.nan

        # Calculate neighbour-to-serving RSRP margin
        if (
            previous["ncell"] == current["cell"]
            and not np.isnan(previous["nrsrp"])
        ):
            margin = (
                previous["nrsrp"]
                - previous["rsrp"]
            )

        events.append({
            "time": current["t"],
            "from": previous["cell"],
            "to": current["cell"],
            "before": previous["rsrp"],
            "after": current["rsrp"],
            "margin": margin
        })
    return events


def classify_handover(margin):
    if np.isnan(margin):
        return "Unknown"
    if margin >= HYSTERESIS_DB:
        return "Healthy"
    if margin > 0:
        return "Weak Margin"
    return "Unjustified"


# ==============================================================
# DETECT PING-PONG HANDOVER
# ==============================================================
def detect_ping_pong(events):
    ping_pong = []
    for first, second in zip(events, events[1:]):
        time_difference = (
            second["time"] - first["time"]
        )
        if (
            second["to"] == first["from"]
            and time_difference <= PING_PONG_WINDOW_S
        ):
            ping_pong.append({
                "cellA": first["from"],
                "cellB": first["to"],
                "time1": first["time"],
                "time2": second["time"],
                "gap": time_difference
            })
    return ping_pong


# ==============================================================
# DWELL TIME
# ==============================================================
def calculate_dwell_time(rows):
    dwell = OrderedDict()
    for previous, current in zip(rows, rows[1:]):
        cell = previous["cell"]
        duration = (
            current["t"] - previous["t"]
        )
        dwell[cell] = (
            dwell.get(cell, 0)
            + duration
        )
    return dwell


# ==============================================================
# TEXT REPORT
# ==============================================================
def print_report(rows, events, ping_pong):
    total_time = (
        rows[-1]["t"] - rows[0]["t"]
    )
    number_of_cells = len(
        set(row["cell"] for row in rows)
    )
    handover_rate = (
        len(events) / total_time * 60
        if total_time > 0
        else 0
    )

    print("\n")
    print("=" * 65)
    print("              HANDOVER ANALYSIS REPORT")
    print("=" * 65)
    print(f"Total route duration : {total_time:.0f} seconds")
    print(f"Total samples        : {len(rows)}")
    print(f"Different cells      : {number_of_cells}")
    print(f"Total handovers      : {len(events)}")
    print(f"Handover rate        : {handover_rate:.2f} per minute")

    print("\n")
    print("HANDOVER DETAILS")
    print("-" * 65)

    if len(events) == 0:
        print("No handover detected.")
    else:
        for event in events:
            if np.isnan(event["margin"]):
                margin_text = "N/A"
            else:
                margin_text = f"{event['margin']:+.0f} dB"

            verdict = classify_handover(event["margin"])

            print(
                f"Time {event['time']:.0f}s : "
                f"{event['from']} -> {event['to']} | "
                f"Margin = {margin_text} | "
                f"{verdict}"
            )

    print("\n")
    print("DWELL TIME PER CELL")
    print("-" * 65)
    dwell = calculate_dwell_time(rows)
    for cell, time in dwell.items():
        print(f"Cell {cell} : {time:.0f} seconds")

    print("\n")
    print("PING-PONG ANALYSIS")
    print("-" * 65)
    if ping_pong:
        print(f"Ping-pong events detected: {len(ping_pong)}")
        for event in ping_pong:
            print(
                f"{event['cellA']} -> "
                f"{event['cellB']} -> "
                f"{event['cellA']} | "
                f"Time gap = {event['gap']:.0f}s"
            )
    else:
        print("No ping-pong handover detected.")

    print("\n")
    print("HYSTERESIS ANALYSIS")
    print("-" * 65)
    marginal = []
    for event in events:
        if (
            not np.isnan(event["margin"])
            and event["margin"] < HYSTERESIS_DB
        ):
            marginal.append(event)
    print(f"Marginal handovers : {len(marginal)} / {len(events)}")
    print("=" * 65)


# ==============================================================
# GRAPHS
# ==============================================================
def plot_rsrp(rows, events):
    time = [row["t"] for row in rows]
    serving_rsrp = [row["rsrp"] for row in rows]
    neighbour_rsrp = [row["nrsrp"] for row in rows]

    plt.figure(figsize=(10, 5))
    plt.plot(time, serving_rsrp, "o-", linewidth=2, label="Serving Cell RSRP")
    plt.plot(time, neighbour_rsrp, "s--", linewidth=2, label="Neighbour Cell RSRP")

    for event in events:
        plt.axvline(event["time"], linestyle=":", linewidth=1.5)

    plt.xlabel("Time (seconds)")
    plt.ylabel("RSRP (dBm)")
    plt.title("Serving Cell and Neighbour Cell RSRP")
    plt.suptitle("Handover Analysis", fontsize=16)
    plt.grid(alpha=0.3)
    plt.legend()
    plt.tight_layout()
    plt.savefig("handover_rsrp_timeline.png", dpi=150)
    plt.show()


def plot_cell_timeline(rows):
    cells = list(
        OrderedDict.fromkeys(
            row["cell"] for row in rows
        )
    )
    cell_index = {
        cell: index for index, cell in enumerate(cells)
    }
    time = [row["t"] for row in rows]
    cell_values = [cell_index[row["cell"]] for row in rows]

    plt.figure(figsize=(10, 4))
    plt.step(time, cell_values, where="post", linewidth=2.5)
    plt.scatter(time, cell_values, s=40)
    plt.yticks(
        range(len(cells)),
        [f"Cell {cell}" for cell in cells]
    )
    plt.xlabel("Time (seconds)")
    plt.ylabel("Serving Cell")
    plt.title("Serving Cell ID Over Time")
    plt.suptitle("Handover Analysis", fontsize=16)
    plt.grid(alpha=0.3, axis="x")
    plt.tight_layout()
    plt.savefig("handover_cell_timeline.png", dpi=150)
    plt.show()


def plot_margins(events):
    valid_events = [
        event for event in events
        if not np.isnan(event["margin"])
    ]
    if not valid_events:
        print("No valid handover margins available.")
        return

    margins = [event["margin"] for event in valid_events]
    labels = [
        f"{event['from']}→{event['to']}\n"
        f"{event['time']:.0f}s"
        for event in valid_events
    ]
    x = np.arange(len(valid_events))

    plt.figure(figsize=(9, 5))
    plt.bar(x, margins, edgecolor="black")
    plt.axhline(
        HYSTERESIS_DB,
        linestyle="--",
        linewidth=2,
        label="Hysteresis = 3 dB"
    )
    plt.axhline(0, linewidth=1)
    plt.xticks(x, labels)
    plt.xlabel("Handover")
    plt.ylabel("Trigger Margin (dB)")
    plt.title("Handover Trigger Margin")
    plt.grid(axis="y", alpha=0.3)
    plt.legend()
    plt.tight_layout()
    plt.savefig("handover_margins.png", dpi=150)
    plt.show()


def plot_hysteresis(events):
    valid_events = [
        event for event in events
        if not np.isnan(event["margin"])
    ]
    if not valid_events:
        return

    hysteresis_values = np.arange(0, 9, 1)
    blocked = []
    for hysteresis in hysteresis_values:
        count = sum(
            1 for event in valid_events
            if event["margin"] < hysteresis
        )
        blocked.append(count)

    plt.figure(figsize=(9, 5))
    plt.plot(hysteresis_values, blocked, "o-", linewidth=2)
    plt.axvline(
        HYSTERESIS_DB,
        linestyle="--",
        linewidth=2,
        label="Current Hysteresis = 3 dB"
    )
    plt.xlabel("Hysteresis Margin (dB)")
    plt.ylabel("Handovers Suppressed")
    plt.title("Effect of Hysteresis on Handovers")
    plt.xticks(range(0, 9))
    plt.grid(alpha=0.3)
    plt.legend()
    plt.tight_layout()
    plt.savefig("hysteresis_sweep.png", dpi=150)
    plt.show()


# ==============================================================
# RUN COMPLETE ANALYSIS
# ==============================================================
rows = load_log(csv_file)
events = detect_handovers(rows)
ping_pong = detect_ping_pong(events)

print_report(rows, events, ping_pong)

plot_rsrp(rows, events)
plot_cell_timeline(rows)
plot_margins(events)
plot_hysteresis(events)

# ==============================================================
# FINAL MESSAGE
# ==============================================================
print("\n")
print("=" * 65)
print("                    ANALYSIS COMPLETED")
print("=" * 65)
print("CSV file:")
print("handover_log.csv")
print("\nGenerated graphs:")
print("1. handover_rsrp_timeline.png")
print("2. handover_cell_timeline.png")
print("3. handover_margins.png")
print("4. hysteresis_sweep.png")
print("=" * 65)

ices with different performance targets.</p><h4>Key terms</h4><ul><li><b>Data rate:</b> amount of data transmitted per second.</li><li><b>Latency:</b> time taken for data to travel from source to destination.</li><li><b>Spectral efficiency:</b> useful data rate per unit bandwidth, commonly expressed in bit/s/Hz.</li><li><b>Handover:</b> transfer of an active connection from one cell/base station to another as the user moves.</li></ul>
