 <h4>Comparison of generations</h4><table><thead><tr><th>Parameter</th><th>2G</th><th>3G</th><th>4G</th><th>5G</th></tr></thead><tbody><tr><td>Example standard</td><td>GSM</td><td>UMTS / WCDMA</td><td>LTE</td><td>5G NR</td></tr><tr><td>Main service</td><td>Voice, SMS</td><td>Voice + mobile data</td><td>Mobile broadband</td><td>Broadband + massive connectivity</td></tr><tr><td>Radio access</td><td>FDMA/TDMA (GSM)</td><td>WCDMA / CDMA</td><td>OFDMA DL, SC-FDMA UL</td><td>Flexible OFDM-based NR</td></tr><tr><td>Data capability</td><td>kbps class (GPRS/EDGE)</td><td>Mbps class</td><td>High Mbps, varies by LTE</td><td>Hundreds Mbps to multi-Gbps potential</td></tr><tr><td>Latency</td><td>High</td><td>Lower than 2G</td><td>Low</td><td>Can be very low with suitable deployment</td></tr><tr><td>Applications</td><td>Calls, SMS</td><td>Browsing, video call</td><td>HD streaming, VoLTE</td><td>IoT, automation, smart services</td></tr></tbody></table><p><b>Note:</b> Actual frequency bands, data rates and latency depend on spectrum, network configuration, signal conditions and operator deployment.</p></section><section class="conclusion"><h3>Conclusion</h3><p>Mobile networks evolved from 2G digital voice to 5G broadband and massive connectivity. Each generation improves network performance and enables new applications; 5G supports advanced IoT, industrial and real-time services.</p></section></div>`,
 exp7: `<div class="theory"><section class="aim"><h3>Aim</h3><p>To study Bluetooth communication using mobile devices, including pairing, file transfer and range testing.</p></section><section><h3>Theory</h3><h4>Introduction and features</h4><p>Bluetooth is a short-range wireless technology for exchanging information between phones, computers, headsets, speakers and IoT devices without cables. It operates in the <b>2.4 GHz ISM band</b>. Classic Bluetooth uses frequency hopping to help reduce interference. Bluetooth is designed for convenient, relatively low-power communication.</p><ul><li>Short-range connectivity; range depends on radio class, antenna, surroundings and interference.</li><li>Supports pairing and authentication, with security features depending on device and mode.</li><li>Used for audio, peripherals, file exchange and device control.</li><li>Bluetooth Classic is commonly used for continuous data/audio links; Bluetooth Low Energy (BLE) is optimized for low-power devices that exchange small amounts of data.</li><li>Profiles define how Bluetooth is used for a specific purpose, such as audio or hands-free operation.</li></ul><h4>Bluetooth pairing and communication steps</h4><ol><li>Enable Bluetooth on both devices.</li><li>Make the receiving device discoverable if needed.</li><li>Scan for nearby devices and select the required device.</li><li>Confirm the pairing code/request on both devices.</li><li>After pairing, establish the relevant connection/profile and transfer data.</li><li>Disconnect when communication is complete.</li></ol>
 <svg class="diagram" viewBox="0 0 900 230" role="img" aria-label="Bluetooth communication between two mobile devices"><g font-family="Arial" text-anchor="middle"><rect x="75" y="30" width="220" height="150" rx="16" fill="#e2edff" stroke="#4776bb" stroke-width="2"/><rect x="605" y="30" width="220" height="150" rx="16" fill="#e2f4e9" stroke="#47966d" stroke-width="2"/><g fill="#26384d"><text x="185" y="70" font-size="22" font-weight="bold">Mobile A</text><text x="185" y="103" font-size="17">Sender</text><text x="185" y="135" font-size="15">Bluetooth ON</text><text x="715" y="70" font-size="22" font-weight="bold">Mobile B</text><text x="715" y="103" font-size="17">Receiver</text><text x="715" y="135" font-size="15">Bluetooth ON</text></g><path d="M305 105 H595" stroke="#6a83a5" stroke-width="3" stroke-dasharray="8 6"/><path d="M585 98 l12 7 -12 7" fill="none" stroke="#6a83a5" stroke-width="3"/><text x="450" y="82" font-size="17" fill="currentColor">2.4 GHz radio link</text><text x="450" y="145" font-size="15" fill="currentColor">Pair → Connect → Transfer</text></g></svg>
 <h4>Pairing, bonding and profiles</h4><p><b>Pairing</b> establishes trust between devices by exchanging or confirming security information. <b>Bonding</b> means storing keys so devices can reconnect later without repeating the full pairing process. After pairing, a profile determines the application-level behavior—for example, a headset profile for audio or an input-device profile for a keyboard.</p><h4>Piconet</h4><p>A classic Bluetooth Piconet is a small network coordinated by one central/master device, with up to seven active peripheral/slave devices in the traditional model (eight active devices including the master). The coordinator manages access to the shared radio channel.</p><svg class="diagram" viewBox="0 0 800 270" role="img" aria-label="Bluetooth piconet diagram"><g stroke="#6b8bb8" stroke-width="2" fill="#e4efff"><line x1="400" y1="125" x2="160" y2="45"/><line x1="400" y1="125" x2="400" y2="35"/><line x1="400" y1="125" x2="640" y2="45"/><line x1="400" y1="125" x2="115" y2="145"/><line x1="400" y1="125" x2="685" y2="145"/><line x1="400" y1="125" x2="250" y2="230"/><line x1="400" y1="125" x2="550" y2="230"/><circle cx="400" cy="125" r="57" fill="#d3e3ff" stroke="#4776bb"/><circle cx="160" cy="45" r="28"/><circle cx="400" cy="35" r="28"/><circle cx="640" cy="45" r="28"/><circle cx="115" cy="145" r="28"/><circle cx="685" cy="145" r="28"/><circle cx="250" cy="230" r="28"/><circle cx="550" cy="230" r="28"/></g><g font-family="Arial" text-anchor="middle" fill="#203044"><text x="400" y="120" font-size="17" font-weight="bold">Master</text><text x="400" y="142" font-size="14">Central</text><g font-size="13"><text x="160" y="49">S1</text><text x="400" y="39">S2</text><text x="640" y="49">S3</text><text x="115" y="149">S4</text><text x="685" y="149">S5</text><text x="250" y="234">S6</text><text x="550" y="234">S7</text></g></g></svg>
 <h4>Scatternet</h4><p>A Scatternet is formed by connecting two or more Piconets. A Bluetooth device may participate in more than one Piconet and can serve as a bridge, subject to the Bluetooth implementation and scheduling.</p><svg class="diagram" viewBox="0 0 800 220" role="img" aria-label="Bluetooth scatternet of two piconets"><g font-family="Arial" text-anchor="middle"><ellipse cx="235" cy="110" rx="180" ry="90" fill="#e5efff" stroke="#5c83bc" stroke-width="2"/><ellipse cx="565" cy="110" rx="180" ry="90" fill="#e4f5e9" stroke="#559a72" stroke-width="2"/><circle cx="190" cy="100" r="32" fill="#bcd3f4" stroke="#4776bb"/><circle cx="280" cy="60" r="22" fill="#fff" stroke="#4776bb"/><circle cx="280" cy="150" r="22" fill="#fff" stroke="#4776bb"/><circle cx="520" cy="60" r="22" fill="#fff" stroke="#559a72"/><circle cx="610" cy="150" r="22" fill="#fff" stroke="#559a72"/><circle cx="610" cy="100" r="32" fill="#bde6ca" stroke="#559a72"/><path d="M315 110 H485" stroke="#7a6ab3" stroke-width="4" stroke-dasharray="7 5"/><text x="235" y="198" font-size="16" fill="currentColor">Piconet 1</text><text x="565" y="198" font-size="16" fill="currentColor">Piconet 2</text><text x="190" y="105" font-size="12" fill="#203044">Master</text><text x="610" y="105" font-size="12" fill="#203044">Master</text><text x="400" y="95" font-size="14" fill="currentColor">Bridge</text><text x="400" y="135" font-size="13" fill="currentColor">device</text></g></svg>
 <h4>File transfer and range test</h4><p>Transfer performance is affected by file size, Bluetooth version, connection quality, distance and interference. Average throughput may be calculated as:</p><p><b>Transfer rate = File size ÷ Transfer time</b></p><p>For range testing, increase the separation between devices gradually and note the point where quality degrades or the link disconnects. Radio signal strength generally falls with distance due to path loss; walls and other obstacles can further attenuate the signal. To keep the test consistent, use the same devices, orientation and environment, and record distance, transfer time and observed connection behavior. Nearby Wi-Fi networks and other 2.4 GHz devices may also affect performance.</p><h4>Advantages and limitations</h4><ul><li><b>Advantages:</b> cable-free connection, low power for suitable devices, easy discovery and broad device support.</li><li><b>Limitations:</b> relatively short range, shared 2.4 GHz spectrum, possible interference, and data rate/range dependent on device class and Bluetooth version.</li></ul><h4>Applications</h4><p>Wireless headphones and speakers, file sharing, smartwatches, keyboards, mice, hands-free car systems and IoT devices.</p></section><section class="conclusion"><h3>Conclusion</h3><p>Bluetooth pairing and wireless communication between mobile devices were studied. The experiment illustrates device discovery, pairing, data transfer, Piconet/Scatternet concepts and the effect of distance on link reliability.</p></section></div>`,
 exp2: `<div class="theory"><section class="aim"><h3>Aim</h3><p>To understand the basic blocks of a communication system and the flow of information from a source to a destination.</p></section><section><h3>Theory</h3><h4>Basic communication system</h4><p>A communication system transfers information from one point to another through a communication channel. The information may be voice, text, image or data. A basic system consists of a <b>source, input transducer, transmitter, channel, receiver, output transducer and destination</b>.</p><svg class="diagram" viewBox="0 0 900 180" role="img" aria-label="Block diagram of a basic communication system"><g font-family="Arial" text-anchor="middle" fill="currentColor" stroke="currentColor"><g fill="#e5efff" stroke="#6387bd"><rect x="15" y="55" width="115" height="60" rx="8"/><rect x="155" y="55" width="115" height="60" rx="8"/><rect x="295" y="55" width="125" height="60" rx="8"/><rect x="445" y="55" width="125" height="60" rx="8"/><rect x="595" y="55" width="115" height="60" rx="8"/><rect x="735" y="55" width="145" height="60" rx="8"/></g><g stroke-width="2" fill="none"><path d="M130 85 H155 M270 85 H295 M420 85 H445 M570 85 H595 M710 85 H735"/><path d="M148 80 l7 5 -7 5 M288 80 l7 5 -7 5 M438 80 l7 5 -7 5 M588 80 l7 5 -7 5 M728 80 l7 5 -7 5"/></g><g stroke="none" font-size="15" fill="#203044"><text x="72" y="90">Source</text><text x="212" y="80">Input</text><text x="212" y="99">transducer</text><text x="357" y="80">Transmitter</text><text x="507" y="80">Channel</text><text x="507" y="99" font-size="12">(noise may occur)</text><text x="652" y="80">Receiver</text><text x="652" y="99"> </text><text x="807" y="80">Output /</text><text x="807" y="99">destination</text></g></g></svg><h4>Function of each block</h4><ul><li><b>Source:</b> generates the message or information.</li><li><b>Input transducer:</b> converts a physical signal, such as sound, into an electrical signal.</li><li><b>Transmitter:</b> processes and modulates the signal, then sends it through an antenna or medium.</li><li><b>Channel:</b> the medium through which the signal travels; examples include air, optical fiber and cable.</li><li><b>Noise:</b> unwanted disturbance added to the signal during transmission.</li><li><b>Receiver:</b> selects, amplifies, demodulates and recovers the message.</li><li><b>Output transducer/destination:</b> converts the recovered signal to a useful form and delivers it to the user.</li></ul><h4>Modulation</h4><p>Modulation changes a carrier signal according to the information signal. It helps transmit signals efficiently, supports practical antenna sizes and allows multiple signals to use different frequency channels. Common analog techniques include AM and FM; digital techniques include ASK, FSK, PSK and QAM.</p><h4>Important performance terms</h4><p><b>Bandwidth</b> is the frequency range occupied by a signal. <b>Signal-to-noise ratio (SNR)</b> compares useful signal power with noise power. Higher SNR generally allows more reliable reception. A communication link is affected by attenuation, noise, interference and distortion.</p></section><section class="conclusion"><h3>Conclusion</h3><p>The basic communication system converts information into a suitable signal, transmits it through a channel and reconstructs it at the receiver. Each block contributes to reliable information transfer.</p></section></div>`,
 exp3: `<div class="theory"><section class="aim"><h3>Aim</h3><p>To study frequency reuse in cellular systems and understand how it improves spectrum utilization.</p></section><section><h3>Theory</h3><h4>Cellular concept</h4><p>A cellular network divides a large service area into smaller regions called <b>cells</b>. Each cell is served by a base station. Instead of assigning a unique frequency to every cell, a set of frequencies is reused in sufficiently separated cells. This increases capacity while controlling co-channel interference.</p><svg class="diagram" viewBox="0 0 800 260" role="img" aria-label="Illustration of frequency reuse in separated cells"><g font-family="Arial" text-anchor="middle" stroke="#6687b5" stroke-width="2"><path d="M120 55 l45 -26 45 26 v52 l-45 26 -45 -26z M210 107 l45 -26 45 26 v52 l-45 26 -45 -26z M300 55 l45 -26 45 26 v52 l-45 26 -45 -26z M390 107 l45 -26 45 26 v52 l-45 26 -45 -26z M480 55 l45 -26 45 26 v52 l-45 26 -45 -26z M570 107 l45 -26 45 26 v52 l-45 26 -45 -26z" fill="#e6efff"/><g fill="#26384d" stroke="none" font-size="17"><text x="165" y="86">F1</text><text x="255" y="138">F2</text><text x="345" y="86">F3</text><text x="435" y="138">F1</text><text x="525" y="86">F2</text><text x="615" y="138">F3</text></g></g><text x="400" y="225" fill="currentColor" text-anchor="middle" font-size="16">Same frequency can be reused in sufficiently separated cells</text></svg><h4>Frequency reuse and cluster size</h4><p>A <b>cluster</b> is a group of neighboring cells in which each frequency channel is used once. The cluster is repeated across the coverage area. The cluster size is represented by <b>N</b>. For an ideal hexagonal layout, possible cluster sizes follow:</p><p><b>N = i² + ij + j²</b>, where i and j are non-negative integers.</p><p>The reuse factor is <b>1/N</b>. A smaller N provides more frequent reuse and higher theoretical capacity, but generally increases co-channel interference. A larger N reduces interference but uses spectrum less aggressively.</p><h4>Reuse distance</h4><p>The approximate ratio between reuse distance D and cell radius R is:</p><p><b>D/R = √(3N)</b></p><p>Here, D is the distance between centers of co-channel cells and R is the cell radius. Increasing D/R generally reduces co-channel interference.</p><h4>Benefits and limitations</h4><ul><li><b>Benefits:</b> greater capacity, efficient use of limited spectrum and scalable coverage.</li><li><b>Limitations:</b> co-channel interference, planning complexity and changing radio conditions.</li><li>Sectoring, power control and careful frequency planning can help manage interference.</li></ul></section><section class="conclusion"><h3>Conclusion</h3><p>Frequency reuse allows cellular systems to serve many users with limited spectrum by repeating channels in separated cells. Cluster size and reuse distance are important design parameters that balance capacity and interference.</p></section></div>`,
 exp4: `<div class="theory"><section class="aim"><h3>Aim</h3><p>To scan nearby Wi-Fi networks and analyze their channels, signal strengths and operating bands.</p></section><section><h3>Theory</h3><h4>Wi-Fi scanning</h4><p>Wi-Fi devices use scanning to discover nearby wireless access points (APs). A scan can reveal the network name (SSID), BSSID (AP radio MAC address), channel, frequency band, security mode and received signal strength indicator (RSSI), depending on the operating system and tool.</p><h4>2.4 GHz and 5 GHz channels</h4><p>The 2.4 GHz band has fewer non-overlapping channel choices and is often congested because Bluetooth and other devices share the band. The 5 GHz band generally offers more channel choices and can support wider channels, but its coverage may be more affected by walls and distance. Channel availability and permitted power depend on local regulations.</p><h4>Channel overlap and interference</h4><p>Adjacent-channel interference can occur when nearby networks use overlapping channels. Co-channel networks share a channel and typically coordinate access through contention; heavy utilization can reduce throughput and increase delay. In many 2.4 GHz deployments, channels 1, 6 and 11 are commonly selected to minimize overlap where channel widths and regulatory settings permit.</p><h4>Signal strength and interpretation</h4><p>RSSI is commonly reported in dBm and is usually negative. Values closer to 0 dBm indicate a stronger received signal; for example, −45 dBm is stronger than −75 dBm. RSSI is not a direct measure of throughput because congestion, noise, channel width, interference and client capabilities also matter.</p><h4>Suggested observation fields</h4><ul><li>SSID and BSSID of the detected AP.</li><li>Frequency band and channel number.</li><li>RSSI / signal level.</li><li>Security type, if reported.</li><li>Number of visible networks sharing or overlapping the channel.</li></ul></section><section class="conclusion"><h3>Conclusion</h3><p>Wi-Fi scanning helps identify nearby access points and channel conditions. Selecting a suitable channel and band can reduce interference and improve wireless performance.</p></section></div>`,
 exp5: `<div class="theory"><section class="aim"><h3>Aim</h3><p>To observe how Wi-Fi received signal strength changes as the distance between the access point and device increases.</p></section><section><h3>Theory</h3><h4>Received signal strength</h4><p>As a Wi-Fi client moves away from an access point, the received power generally decreases because radio energy spreads over a larger area. This reduction is called <b>path loss</b>. Walls, floors, furniture and people can further attenuate or reflect the signal.</p><h4>RSSI in dBm</h4><p>RSSI is a measure of received signal level, commonly shown in dBm. Because dBm is logarithmic, a change of 10 dB corresponds to a tenfold change in power. Typical practical interpretations are approximate: around −30 to −50 dBm is very strong, around −60 to −70 dBm is often usable, and values near or below −80 dBm may produce unreliable links depending on the application and noise.</p><h4>Free-space path loss</h4><p>In an ideal free-space model, path loss increases with distance and frequency. Real indoor environments differ because of multipath, obstructions and reflections. Therefore, measured RSSI may fluctuate rather than decrease smoothly at every step.</p><h4>Experimental method</h4><ol><li>Keep the AP and client device fixed in orientation.</li><li>Measure RSSI at a short starting distance.</li><li>Increase the separation by consistent intervals.</li><li>Record RSSI, distance and connection quality at each point.</li><li>Repeat readings when possible and compare the trend.</li></ol><h4>Factors affecting results</h4><ul><li>Obstacles and wall materials.</li><li>Interference from other Wi-Fi networks and 2.4 GHz devices.</li><li>AP transmit power, antenna pattern and device orientation.</li><li>Frequency band, channel width and environmental reflections.</li></ul></section><section class="conclusion"><h3>Conclusion</h3><p>Wi-Fi signal strength generally decreases as distance and obstruction increase. Measurements can vary due to multipath and interference, so controlled conditions and repeated readings improve the reliability of the observation.</p></section></div>`,
 exp8: `<div class="theory"><section class="aim"><h3>Aim</h3><p>To study the role of GSM security algorithms A3, A8 and A5 in subscriber authentication and radio-link encryption.</p></section><section><h3>Theory</h3><h4>GSM security overview</h4><p>GSM security uses a subscriber secret key <b>Ki</b> stored in the SIM and the operator's authentication center. Ki is not sent over the air. A challenge-response procedure verifies that the subscriber possesses the correct secret, while a session cipher key is generated for encryption of the radio link.</p><h4>A3 — Authentication</h4><p>A3 is the authentication algorithm. The network sends a random challenge <b>RAND</b> to the SIM. The SIM computes a signed response <b>SRES</b> using RAND and Ki. The network compares the received response with its expected value. A match supports authentication of the subscriber.</p><h4>A8 — Cipher key generation</h4><p>A8 derives the cipher key <b>Kc</b> from Ki and RAND. The resulting Kc is used by the ciphering algorithm to protect traffic over the radio interface. In classic GSM implementations, A3 and A8 are often implemented together as a single COMP128-family function, although the conceptual roles are distinct.</p><h4>A5 — Encryption</h4><p>A5 is the family of stream ciphers used to encrypt and decrypt GSM radio traffic using Kc and frame-related inputs. A5/1 and A5/2 are older variants; A5/3 is a stronger later variant. Security depends on the cipher selected, implementation and network configuration. GSM encryption primarily protects the air interface, not necessarily the entire end-to-end path.</p><svg class="diagram" viewBox="0 0 900 230" role="img" aria-label="GSM authentication and cipher key derivation flow"><g font-family="Arial" text-anchor="middle" fill="currentColor"><rect x="25" y="35" width="200" height="65" rx="8" fill="#e5efff" stroke="#6387bd"/><rect x="350" y="35" width="200" height="65" rx="8" fill="#e5f4e9" stroke="#559a72"/><rect x="675" y="35" width="200" height="65" rx="8" fill="#fff0d9" stroke="#bf8b40"/><g font-size="16"><text x="125" y="61">Network sends</text><text x="125" y="82">RAND</text><text x="450" y="61">SIM calculates</text><text x="450" y="82">SRES and Kc</text><text x="775" y="61">Network checks</text><text x="775" y="82">SRES</text></g><path d="M225 68 H350 M550 68 H675" stroke="currentColor" stroke-width="2"/><path d="M340 62 l10 6 -10 6 M665 62 l10 6 -10 6" stroke="currentColor" fill="none" stroke-width="2"/><text x="450" y="150" font-size="17">Kc → A5 ciphering → protected radio link</text><text x="450" y="185" font-size="14">Ki remains stored securely in SIM and network authentication center</text></g></svg><h4>Algorithm roles at a glance</h4><table><thead><tr><th>Algorithm</th><th>Purpose</th><th>Input / output concept</th></tr></thead><tbody><tr><td>A3</td><td>Subscriber authentication</td><td>Ki + RAND → SRES</td></tr><tr><td>A8</td><td>Session cipher-key generation</td><td>Ki + RAND → Kc</td></tr><tr><td>A5</td><td>Radio-link encryption</td><td>Kc + frame inputs → keystream</td></tr></tbody></table><p><b>Security note:</b> These algorithms are presented for learning the GSM architecture. Modern cellular generations use different security procedures and algorithms.</p></section><section class="conclusion"><h3>Conclusion</h3><p>A3 authenticates the subscriber, A8 generates the cipher key Kc, and A5 encrypts GSM radio traffic. Together they provide authentication and air-interface confidentiality in GSM.</p></section></div>`,
 exp9: `<div class="theory"><section class="aim"><h3>Aim</h3><p>To analyze multipath propagation and observe its effect on a received wireless signal.</p></section><section><h3>Theory</h3><h4>Multipath propagation</h4><p>In a wireless environment, a transmitted signal may reach the receiver by several paths due to reflection, diffraction and scattering. The received signal is the combination of multiple delayed and attenuated copies. These copies can add constructively or destructively, causing fluctuations in received amplitude and phase known as <b>multipath fading</b>.</p><svg class="diagram" viewBox="0 0 800 250" role="img" aria-label="Multipath radio propagation paths"><g font-family="Arial" fill="currentColor" stroke-width="2"><rect x="35" y="90" width="115" height="85" rx="8" fill="#e5efff" stroke="#6387bd"/><rect x="650" y="90" width="115" height="85" rx="8" fill="#e4f4e9" stroke="#559a72"/><text x="92" y="125" text-anchor="middle" font-size="16" stroke="none">Transmitter</text><text x="92" y="148" text-anchor="middle" font-size="13" stroke="none">Tx</text><text x="707" y="125" text-anchor="middle" font-size="16" stroke="none">Receiver</text><text x="707" y="148" text-anchor="middle" font-size="13" stroke="none">Rx</text><path d="M150 130 H650" stroke="#438b68"/><path d="M150 110 L400 25 L650 110" stroke="#527eb7" fill="none"/><path d="M150 155 L400 220 L650 155" stroke="#b77a35" fill="none"/><g font-size="14" stroke="none"><text x="400" y="18" text-anchor="middle">Reflected path</text><text x="400" y="115" text-anchor="middle">Direct path</text><text x="400" y="240" text-anchor="middle">Scattered / reflected path</text></g></g></svg><h4>Types of fading</h4><ul><li><b>Small-scale fading:</b> rapid variation over short distances or time due to multipath.</li><li><b>Large-scale fading:</b> average signal variation over longer distances, including path loss and shadowing.</li><li><b>Flat fading:</b> signal components across the signal bandwidth experience similar fading.</li><li><b>Frequency-selective fading:</b> different frequency components experience different attenuation due to delay spread.</li></ul><h4>Delay spread and coherence bandwidth</h4><p>Different paths arrive at different times, creating delay spread. If the signal bandwidth is much smaller than the channel's coherence bandwidth, fading is more likely to be flat. If the signal bandwidth exceeds coherence bandwidth, frequency-selective distortion may occur. The exact relationship depends on the delay profile and chosen statistical definition.</p><h4>Ways to reduce multipath effects</h4><ul><li>Antenna diversity or MIMO processing.</li><li>Equalization and appropriate OFDM-based transmission.</li><li>Careful antenna placement and line-of-sight improvement where possible.</li><li>Interleaving and coding to mitigate burst errors.</li></ul></section><section class="conclusion"><h3>Conclusion</h3><p>Multipath propagation creates multiple delayed signal copies that can strengthen or weaken the received signal. Understanding fading and delay spread helps explain wireless performance variations and motivates diversity, equalization and OFDM techniques.</p></section></div>`,
 exp10: `<div class="theory"><section class="aim"><h3>Aim</h3><p>To analyze handover behavior as a mobile device moves between cells and observe signal measurements and handover events.</p></section><section><h3>Theory</h3><h4>Handover / handoff</h4><p>Handover is the transfer of an ongoing call or data session from one serving cell or base station to another, typically as the user moves or radio conditions change. It helps maintain service continuity and can also be triggered by load balancing or coverage optimization.</p><h4>Handover stages</h4><ol><li><b>Measurement:</b> the mobile and/or network measures serving and neighboring cell signal quality.</li><li><b>Decision:</b> the network evaluates configured criteria, thresholds and timers.</li><li><b>Execution:</b> radio resources are prepared and the connection is switched to the target cell.</li><li><b>Completion:</b> the target cell confirms the connection and old resources are released.</li></ol><h4>Common types</h4><ul><li><b>Hard handover:</b> break-before-make; the old link is released as the new one is established. Common in GSM and LTE procedures.</li><li><b>Soft handover:</b> make-before-break; a device can maintain links with multiple base stations during transition. Associated with some CDMA systems.</li><li><b>Horizontal handover:</b> between access points/cells using the same radio technology.</li><li><b>Vertical handover:</b> between different access technologies, such as cellular and Wi-Fi.</li></ul><h4>Signal metrics and decision factors</h4><p><b>RSSI</b> indicates received signal level. Cellular systems may also use RSRP, RSRQ and SINR to assess coverage and quality. Handover decisions can include signal thresholds, hysteresis, time-to-trigger, neighbor-cell information and network load. Hysteresis and timers help avoid rapid repeated handovers called <b>ping-pong</b>.</p><h4>Analysis observations</h4><p>During movement, record time, serving cell, neighbor cell measurements and the handover event. A successful handover should preserve the session with minimal interruption. A poor target choice, weak coverage or excessive delay may cause a dropped connection or interruption.</p><h4>Factors affecting handover</h4><ul><li>Speed and direction of the mobile device.</li><li>Cell overlap and signal-quality difference between serving and target cells.</li><li>Hysteresis, thresholds and time-to-trigger settings.</li><li>Network load, interference and backhaul/resource availability.</li></ul></section><section class="conclusion"><h3>Conclusion</h3><p>Handover maintains connectivity while a mobile device moves across cell boundaries. Measurements, decision criteria and execution timing determine whether the transition is smooth and reliable.</p></section></div>`
};

function copy(text, btn){
  var done = function(){ var o = btn.textContent; btn.textContent = 'Copied ✓'; setTimeout(function(){ btn.textContent = o; }, 1500); };
  var fallback = function(){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { btn.textContent = 'Press Ctrl+C'; }
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}

function el(tag, cls, text){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

var VIVA = {"exp1": [["What is the electromagnetic spectrum?", "The complete range of electromagnetic waves arranged according to frequency or wavelength."], ["What is the relation between frequency and wavelength?", "c = fλ. In vacuum, frequency and wavelength are inversely proportional."], ["Why is spectrum allocation required?", "To assign frequency bands to services and reduce harmful interference."], ["Which frequency bands are used for mobile communication?", "Common cellular deployments use bands in the UHF range and, for newer systems, some SHF/mmWave bands."], ["What happens to wavelength when frequency increases?", "Wavelength decreases, because c = fλ."], ["What is the difference between a radio wave's frequency and wavelength?", "Frequency is the number of cycles per second, measured in hertz (Hz). Wavelength is the distance covered in one cycle, measured in metres. They are related by c = fλ."], ["What is the electromagnetic spectrum?", "It is the complete range of electromagnetic radiation, arranged by frequency or wavelength, from radio waves to gamma rays."], ["Why is radio spectrum considered a limited resource?", "Only a finite range of frequencies is practically available, and nearby services can interfere if spectrum is not coordinated."], ["What is spectrum allocation?", "It is the regulatory process of assigning frequency bands to specific services, such as mobile, broadcasting, satellite or Wi-Fi."], ["What is the role of ITU in spectrum management?", "The International Telecommunication Union coordinates international radio-frequency use and helps prevent harmful interference across countries."]], "exp2": [["What is a basic communication system?", "A system that transfers information from a source to a destination through a transmitter, channel and receiver."], ["What are the main blocks of a communication system?", "Source, input transducer, transmitter, communication channel, receiver, output transducer and destination."], ["What is modulation?", "Modulation is the process of varying a carrier signal according to the information signal."], ["What is noise?", "An unwanted disturbance that affects the transmitted signal during communication."], ["What is the function of a receiver?", "It processes the received signal, demodulates or decodes it, and recovers the information."], ["Why is a carrier signal used in communication?", "A carrier is a high-frequency signal that can be modified to carry information and is suitable for efficient transmission through a channel or antenna."], ["What is the difference between analog and digital communication?", "Analog communication sends continuously varying signals, while digital communication represents information using discrete symbols or bits."], ["Differentiate modulation and demodulation.", "Modulation places information onto a carrier at the transmitter. Demodulation extracts the information from the received modulated carrier."], ["What is bandwidth in a communication system?", "Bandwidth is the range of frequencies occupied or passed by a signal or channel, usually measured in hertz."], ["What is signal-to-noise ratio (SNR)?", "SNR is the ratio of signal power to noise power. A higher SNR generally indicates a cleaner received signal."]], "exp3": [["What is frequency reuse?", "Using the same frequency channels in different cells separated sufficiently to limit co-channel interference."], ["What is a cell in a cellular network?", "A geographic coverage area served by a base station."], ["What is a cluster?", "A group of adjacent cells in which the available frequency channels are assigned before the pattern repeats."], ["What is co-channel interference?", "Interference between cells that use the same frequency channel."], ["What is the reuse distance?", "The distance between the centers of two cells using the same frequency set."], ["Why are cells often represented as hexagons in cellular planning?", "Hexagons tessellate without gaps and approximate circular coverage, making them convenient for frequency-planning diagrams."], ["What is the cluster size N?", "N is the number of cells in one frequency-reuse cluster. For a hexagonal layout, N = i² + ij + j², where i and j are non-negative integers."], ["How is the frequency reuse ratio defined?", "The reuse ratio is commonly expressed as Q = D/R, where D is co-channel reuse distance and R is cell radius; for a hexagonal system Q = √(3N)."], ["What is the trade-off when cluster size increases?", "A larger cluster generally reduces co-channel interference but gives each cell fewer channels for a fixed total spectrum, reducing capacity."], ["What is sectoring and why is it used?", "Sectoring divides a cell into directional sectors using antennas. It can reduce interference and improve capacity, though it requires additional equipment and planning."]], "exp4": [["What is Wi-Fi scanning?", "The process of discovering nearby wireless access points and collecting information such as SSID, channel and signal strength."], ["What does SSID mean?", "Service Set Identifier; the network name advertised by a Wi-Fi access point."], ["What is RSSI?", "Received Signal Strength Indicator, a measurement of received radio signal strength."], ["Why analyze Wi-Fi channels?", "To identify channel overlap or congestion and choose a channel with less interference."], ["What is the 2.4 GHz Wi-Fi channel overlap issue?", "Many 2.4 GHz channels overlap; commonly used non-overlapping channel sets include 1, 6 and 11 where the regulatory plan allows."], ["How can a Wi-Fi scanner identify a nearby access point?", "It listens for wireless beacon or probe-response frames and extracts fields such as SSID, BSSID, channel and signal level."], ["What is BSSID and how is it different from SSID?", "SSID is the advertised network name. BSSID identifies a particular access point radio, usually by its MAC address."], ["What does a Wi-Fi channel number represent?", "It identifies a center frequency or channel allocation within a Wi-Fi band; the exact frequency depends on the band and channel."], ["Why are channels 1, 6 and 11 often recommended for 2.4 GHz Wi-Fi?", "In many 20 MHz channel plans, they are separated enough to avoid overlapping with one another, reducing adjacent-channel interference."], ["Why might a channel with fewer networks still perform poorly?", "Interference from non-Wi-Fi devices, weak signal, wide channel use, hidden nodes, congestion or poor backhaul can still reduce performance."]], "exp5": [["What is path loss?", "The reduction in radio signal power as it propagates from transmitter to receiver."], ["Why does RSSI usually decrease with distance?", "The signal spreads over a larger area and experiences path loss; obstacles can add attenuation."], ["What is attenuation?", "A reduction in signal strength as it travels through a medium or obstacle."], ["How can obstacles affect Wi-Fi?", "Walls, furniture and other objects may absorb, reflect or scatter radio waves, weakening the received signal."], ["Does distance always cause a perfectly smooth RSSI decrease?", "No. Reflections, interference and multipath can cause local fluctuations."], ["What is the difference between RSSI and SNR?", "RSSI indicates received signal level, while SNR compares signal power with noise power. A strong RSSI can still have poor quality if noise is high."], ["What is the log-distance path-loss model?", "It models path loss as increasing with logarithm of distance: PL(d) = PL(d0) + 10n log10(d/d0), with n representing the path-loss exponent."], ["What is free-space path loss?", "It is the reduction in signal power during propagation through unobstructed free space, depending on distance and frequency."], ["What is multipath fading and how can it affect RSSI?", "Multipath fading occurs when delayed copies of a signal combine. They may reinforce or cancel, causing RSSI to fluctuate across locations."], ["How can Wi-Fi signal strength be improved?", "Move closer to the access point, reduce obstacles, position it centrally and elevated, and select a less congested channel or band."]], "exp6": [["What is a cellular network?", "A wireless network divided into cells, each served by a base station to provide mobile connectivity."], ["What is the main difference between 2G and 3G?", "2G primarily introduced digital voice and messaging, while 3G expanded mobile data capability."], ["Which multiple access techniques are associated with GSM?", "GSM uses FDMA to divide spectrum into carriers and TDMA to divide each carrier into time slots."], ["What is LTE?", "Long Term Evolution, a 4G cellular technology designed for high-speed packet data and efficient radio access."], ["Name two important 5G technologies.", "Massive MIMO and beamforming; 5G also supports flexible numerology and network slicing."], ["What are FDMA and TDMA in GSM?", "FDMA divides spectrum into frequency carriers; TDMA divides each carrier into repeating time slots assigned to users."], ["What is the purpose of a base station in a cellular network?", "It provides radio coverage to a cell and communicates wirelessly with mobile devices while connecting them to the wider network."], ["What is the difference between a handover and roaming?", "Handover transfers an active connection between cells or access points. Roaming allows a subscriber to use a network outside their home network, subject to agreements."], ["What is the main idea of MIMO?", "Multiple antennas transmit and/or receive signals to improve throughput, reliability or coverage using spatial processing."], ["What is beamforming in 5G?", "Beamforming directs radio energy toward a device using antenna-array processing, improving link quality and reducing unwanted radiation in other directions."]], "exp7": [["What is Bluetooth?", "A short-range wireless technology operating in the 2.4 GHz ISM band for connecting devices."], ["What is Bluetooth pairing?", "The process of establishing trust and security information between Bluetooth devices."], ["What is bonding?", "Storing pairing keys so devices can reconnect securely later."], ["What is a Bluetooth piconet?", "A small Bluetooth network organized around one central/master device and connected peripheral/slave devices."], ["What is the difference between Bluetooth Classic and BLE?", "Classic is common for continuous data and audio links; Bluetooth Low Energy is designed for lower-power data exchange."], ["Which frequency band does Bluetooth use?", "Bluetooth operates in the 2.4 GHz ISM band, using frequency hopping to reduce the effect of interference."], ["What is Bluetooth frequency hopping?", "The radio changes channels rapidly according to a defined hopping sequence, helping avoid persistent interference on one frequency."], ["What is the role of a Bluetooth profile?", "A profile defines rules and services for a particular use case, such as audio streaming or hands-free operation."], ["What is the difference between Bluetooth Classic and Bluetooth Low Energy?", "Classic is commonly used for continuous data and audio applications; BLE is optimized for low-power, intermittent data exchange."], ["Why is Bluetooth suitable for short-range personal-area networks?", "It provides relatively low-power wireless connectivity for nearby devices such as phones, headsets, sensors and peripherals."]], "exp8": [["What is the purpose of A3 in GSM?", "A3 is used for subscriber authentication by producing the signed response SRES from Ki and RAND."], ["What is the purpose of A8?", "A8 derives the cipher key Kc using the subscriber key Ki and random challenge RAND."], ["What is the purpose of A5?", "A5 is the family of ciphers used to encrypt GSM radio-link traffic."], ["What is RAND?", "A random challenge sent by the network during authentication."], ["Is Ki transmitted over the air?", "No. Ki remains stored in the SIM and the network authentication center."], ["What is the GSM authentication procedure in brief?", "The network sends RAND; the SIM uses Ki and the authentication algorithm to calculate SRES. The network compares the response to authenticate the subscriber."], ["What are Ki and RAND in GSM?", "Ki is the secret subscriber authentication key stored securely in the SIM and network AuC. RAND is a random challenge sent by the network."], ["What is SRES?", "Signed Response (SRES) is the authentication response computed by the SIM from the secret key Ki and challenge RAND."], ["How are A3, A8 and A5 different?", "A3 computes the authentication response, A8 derives the cipher key Kc, and A5 encrypts traffic over the GSM radio link."], ["Why is the secret key Ki never sent over the air?", "Keeping Ki secret prevents an eavesdropper from directly obtaining the subscriber's long-term authentication key."]], "exp9": [["What is multipath propagation?", "The arrival of multiple delayed and attenuated copies of a signal through different propagation paths."], ["What causes multipath?", "Reflection, diffraction and scattering from buildings, terrain and other objects."], ["What is fading?", "Variation in received signal amplitude or power caused by propagation effects such as multipath."], ["What is constructive interference?", "When signal components combine in phase and increase the resultant amplitude."], ["What is destructive interference?", "When signal components combine out of phase and reduce the resultant amplitude."], ["What is the difference between large-scale and small-scale fading?", "Large-scale fading describes average signal variation over longer distances due to path loss and shadowing. Small-scale fading is rapid fluctuation from multipath."], ["What is shadowing?", "Shadowing is slower variation in received power caused by obstacles such as buildings, hills or walls blocking or attenuating the path."], ["How does constructive interference occur?", "When arriving signal components have phases that align, their amplitudes add and the resultant signal becomes stronger."], ["How does destructive interference occur?", "When components arrive with opposing phases, they partially or nearly completely cancel, reducing the received signal."], ["What is Doppler shift?", "It is the apparent change in received frequency caused by relative motion between transmitter and receiver; it can affect rapidly moving wireless devices."]], "exp10": [["What is handover (handoff)?", "The transfer of an ongoing mobile connection from one cell or base station to another."], ["Why is handover needed?", "To maintain service as a mobile user moves and the serving cell’s signal becomes weaker."], ["What is a handover trigger?", "A condition such as signal strength, signal quality or network policy that initiates handover evaluation."], ["What is the difference between hard and soft handover?", "Hard handover breaks the old connection before establishing the new one; soft handover can maintain connections to multiple base stations during the transition, where supported."], ["What can cause a failed handover?", "Poor coverage, delayed decisions, unavailable target-cell resources or rapidly changing signal conditions."], ["What is the difference between intra-cell and inter-cell handover?", "Intra-cell handover changes a channel or resource within the same cell. Inter-cell handover transfers service to a different cell."], ["What is hysteresis in handover?", "Hysteresis is a margin between serving- and neighboring-cell measurements that helps prevent unnecessary handovers and ping-pong effects."], ["What is the ping-pong effect?", "It is repeated handover back and forth between cells due to fluctuating measurements or overly sensitive thresholds."], ["What is the role of time-to-trigger?", "The condition must remain satisfied for a configured duration before a handover decision, filtering short-lived signal fluctuations."], ["Name important measurements used for LTE/5G handover decisions.", "Common measurements include RSRP, RSRQ and SINR, along with neighbor-cell measurements and configured thresholds."]]};

function appendViva(ex, container) {
  var questions = VIVA[ex.id] || [];
  if (!questions.length) return;
  var section = el('section', 'viva-section');
  var heading = el('h3', '', 'Viva Questions & Answers');
  section.appendChild(heading);
  var intro = el('p', 'viva-intro', 'Viva preparation — all questions and answers are displayed below for direct revision.');
  section.appendChild(intro);
  questions.forEach(function(item, index) {
    var entry = el('div', 'viva-item');
    var question = el('p', 'viva-question', (index + 1) + '. ' + item[0]);
    var answer = el('p', 'viva-answer', 'Answer: ' + item[1]);
    entry.appendChild(question);
    entry.appendChild(answer);
    section.appendChild(entry);
  });
  container.appendChild(section);
}

function render(){
  var id = (location.hash || '').slice(1);
  var ex = EXPS.filter(function(x){ return x.id === id; })[0] || EXPS[1];
  var nav = document.getElementById('nav');
  nav.innerHTML = '';
  EXPS.forEach(function(x){
    var a = el('a', x.id === ex.id ? 'on' : '', 'Exp ' + x.id.slice(3));
    a.href = '#' + x.id;
    nav.appendChild(a);
  });
  var v = document.getElementById('view');
  v.innerHTML = '';
  v.appendChild(el('h2', '', 'Experiment ' + ex.id.slice(3) + ' – ' + ex.t));
  if (ex.none){
    if (THEORY[ex.id]) { var theoryBox = el('div'); theoryBox.innerHTML = THEORY[ex.id]; v.appendChild(theoryBox); }
    else { v.appendChild(el('div', 'note', 'No code for this experiment (study / observation experiment).')); }
    appendViva(ex, v);
    return;
  }
  var src = document.getElementById('src-' + ex.id);
  var code = src ? src.textContent.replace(/^\n+/, '').replace(/\s+$/, '') + '\n' : '';
  // Keep setup/install and runnable code at the top; put the theory and diagrams afterward.
  var row = el('div', 'row');
  row.appendChild(el('code', '', ex.i));
  var b1 = el('button', '', 'Copy install'); b1.onclick = function(){ copy(ex.i, b1); };
  row.appendChild(b1);
  v.appendChild(row);
  if (!code){
    v.appendChild(el('div', 'note', 'This experiment’s code isn’t on the page yet. Copy it from the chat for now.'));
  } else {
    var bar = el('div', 'bar');
    bar.appendChild(el('span', '', 'Python · ' + code.split('\n').length + ' lines'));
    var b2 = el('button', '', 'Copy code'); b2.onclick = function(){ copy(code, b2); };
    bar.appendChild(b2);
    v.appendChild(bar);
    var pre = el('pre'); pre.appendChild(el('code', '', code));
    v.appendChild(pre);
  }
  if (THEORY[ex.id]) { var theoryBox = el('div'); theoryBox.innerHTML = THEORY[ex.id]; v.appendChild(theoryBox); }
  appendViva(ex, v);
}
window.addEventListener('hashchange', render);
render();
</script>
